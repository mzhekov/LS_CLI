[pytest]
# Pytest configuration for LeadSauce CLI

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    -l
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Warnings
    -W ignore::DeprecationWarning
    # Coverage (uncomment to enable by default)
    # --cov=leadsauce
    # --cov-report=html
    # --cov-report=term-missing

# Markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    navigation: marks tests related to TUI navigation
    crud: marks tests for CRUD operations
    relationship: marks tests for relationship management
    task: marks tests for task management
    goal: marks tests for goal management
    edge_case: marks tests for edge cases
    known_issue: marks tests documenting known issues

# Minimum Python version
minversion = 3.8

# Disable pytest-cov warnings
filterwarnings =
    ignore::pytest.PytestConfigWarning

# Test output
console_output_style = progress

# Timeout for tests (if pytest-timeout is installed)
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# addopts = -n auto
